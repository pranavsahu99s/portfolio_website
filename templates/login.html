<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; }
        .glass-effect { background: rgba(0, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 255, 0.1); }
        .form-input { background: rgba(0, 255, 255, 0.05); border: 1px solid rgba(0, 255, 255, 0.1); transition: all 0.3s ease; }
        .form-input:focus { outline: none; border-color: #00ffff; box-shadow: 0 0 25px rgba(0, 255, 255, 0.3); }
        .shine-button { position: relative; overflow: hidden; transition: all 0.3s; }
        .shine-button:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(0, 255, 255, 0.4); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="glass-effect p-10 rounded-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-white mb-6">Admin Login</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="bg-red-500/20 border border-red-500 text-red-300 p-3 rounded mb-6 text-center">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-6">
                <input type="password" name="password" placeholder="Enter Admin Password" class="form-input w-full p-4 rounded-lg text-white" required>
            </div>
            <button type="submit" class="shine-button bg-cyan-500 text-black font-bold w-full py-4 rounded-lg hover:bg-cyan-600">Login</button>
        </form>
        <div class="text-center mt-4">
            <a href="{{ url_for('home') }}" class="text-cyan-400 hover:underline text-sm">&larr; Back to Portfolio</a>
        </div>
    </div>
</body>
</html>
